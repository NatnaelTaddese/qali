name: macOS release

# Builds the shareable Mac app (apps/macos) when a push's head commit message
# carries [release-macos]. Any branch gets the zip as a workflow artifact; a
# push to main also publishes it as a GitHub release tagged macos-v<version>,
# so bump MARKETING_VERSION in apps/macos/project.yml for each release (a
# version that is already released fails before the build). A merged PR's
# head commit is the merge commit, whose message includes the PR title, so a
# PR titled "... [release-macos]" releases when it merges. Run it by hand from
# the Actions tab too.
#
# Updates: each release also carries appcast.xml, signed with the Sparkle
# EdDSA key in the SPARKLE_PRIVATE_KEY secret. The app reads it from
# releases/latest/download/appcast.xml, so the newest release in this repo
# must stay a Mac one.
#
# Signing: ad-hoc unless these repository secrets are set, in which case the
# build is signed with that identity (still not notarized):
#   MACOS_CERTIFICATE_P12       base64 of the exported .p12
#   MACOS_CERTIFICATE_PASSWORD  the .p12's password
#   MACOS_TEAM_ID               the certificate's organisational unit
#   MACOS_SIGNING_IDENTITY      optional, defaults to "Apple Development"

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-macos]')
    # The app builds with Xcode 27 (26.6's compiler crashes on it), which only
    # GitHub's xcode-27 image (a preview) carries for now.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v4

      - name: Check the version isn't released yet
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_SPARKLE_KEY" != true ]; then
            echo "::error::The SPARKLE_PRIVATE_KEY secret is missing, so the update couldn't be signed."
            exit 1
          fi
          VERSION=$(sed -n 's/^ *MARKETING_VERSION: *//p' project.yml | head -n 1)
          if gh release view "macos-v$VERSION" >/dev/null 2>&1; then
            echo "::error::macos-v$VERSION is already released. Bump MARKETING_VERSION in apps/macos/project.yml."
            exit 1
          fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'

      - name: Install XcodeGen
        run: brew install xcodegen

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dmgbuild
        run: |
          python -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==2.0.0
          echo "DMGBUILD=$RUNNER_TEMP/dmgbuild/bin/dmgbuild" >> "$GITHUB_ENV"

      - name: Import the signing identity
        if: env.HAS_CERTIFICATE == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          printf 'CODE_SIGN_IDENTITY = %s\nDEVELOPMENT_TEAM = %s\n' \
            "${SIGNING_IDENTITY:-Apple Development}" "$TEAM_ID" > Config/Local.xcconfig

      - name: Test
        run: |
          xcodegen generate --quiet
          xcodebuild test -project Qali.xcodeproj -scheme Qali \
            -destination 'platform=macOS' -derivedDataPath build -quiet

      - name: Build
        id: build
        run: scripts/release.sh "${{ github.run_number }}"

      # A build that can't start (0.1.1: dyld refused Sparkle.framework under
      # ad-hoc signing) must never be published.
      - name: Launch the built app
        run: |
          APP=build-release/Build/Products/Release/Qali.app
          "$APP/Contents/MacOS/Qali" > "$RUNNER_TEMP/launch.log" 2>&1 &
          PID=$!
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then
            cat "$RUNNER_TEMP/launch.log"
            echo "::error::Qali quit within 10 seconds of launching."
            exit 1
          fi
          kill "$PID"

      - name: Sign the update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          ZIP: ${{ steps.build.outputs.zip }}
        working-directory: .
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning::No SPARKLE_PRIVATE_KEY secret: skipping the appcast."
            exit 0
          fi
          # Sparkle's sign_update, pinned to the version the app links.
          SPARKLE="$RUNNER_TEMP/sparkle"
          mkdir -p "$SPARKLE"
          gh release download 2.10.1 -R sparkle-project/Sparkle -p 'Sparkle-2.10.1.tar.xz' -D "$SPARKLE"
          echo "1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27  $SPARKLE/Sparkle-2.10.1.tar.xz" | shasum -a 256 -c -
          tar -xf "$SPARKLE/Sparkle-2.10.1.tar.xz" -C "$SPARKLE"
          TAG="macos-v$VERSION"
          SIGN_UPDATE="$SPARKLE/bin/sign_update" apps/macos/scripts/appcast.sh "$ZIP" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$ZIP")" \
            "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            > apps/macos/dist/appcast.xml
          cat apps/macos/dist/appcast.xml

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: |
            ${{ steps.build.outputs.zip }}
            ${{ steps.build.outputs.dmg }}
            apps/macos/dist/appcast.xml
          if-no-files-found: error

      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          BUILD: ${{ steps.build.outputs.build }}
          ZIP: ${{ steps.build.outputs.zip }}
          DMG: ${{ steps.build.outputs.dmg }}
        working-directory: .
        run: |
          gh release create "macos-v$VERSION" "$DMG" "$ZIP" apps/macos/dist/appcast.xml \
            --target "$GITHUB_SHA" \
            --title "Qali for Mac $VERSION ($BUILD)" \
            --notes "Download the .dmg, open it and drag Qali into Applications. Apple silicon, macOS 26.2 or later. The app isn't notarized: after the first launch is blocked, open System Settings → Privacy & Security and choose Open Anyway. Once installed, Qali updates itself."
